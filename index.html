  <title>バズりマップ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #0a0a0a; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* ===== TOP BAR ===== */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 12px 16px 8px;
      background: linear-gradient(to bottom, rgba(10,10,10,0.95) 80%, transparent);
    }
    #top-bar h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #ff6b6b, #ffd93d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; letter-spacing: -0.5px; }
    #top-bar h1 span { font-size: 13px; }

    /* ===== FILTERS ===== */
    #filter-bar {
      position: fixed; top: 48px; left: 0; right: 0; z-index: 99;
      display: flex; gap: 8px; padding: 6px 16px 8px; overflow-x: auto;
      background: linear-gradient(to bottom, rgba(10,10,10,0.9) 70%, transparent);
      scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .filter-chip.active { background: #ff6b6b; border-color: #ff6b6b; color: #fff; }

    /* ===== MAP ===== */
    #map { width: 100%; flex: 1; }
    #map-view { display: flex; flex-direction: column; height: 100%; }

    /* ===== VIEWS ===== */
    #ranking-view, #favorites-view {
      display: none; flex-direction: column; flex: 1; overflow: hidden;
      padding-top: 48px;
    }
    .list-header {
      position: sticky; top: 48px; z-index: 50;
      padding: 10px 16px 8px;
      background: rgba(10,10,10,0.97);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px; color: #888;
    }
    .list-header strong { color: #fff; }
    .list-body { overflow-y: auto; flex: 1; padding-bottom: 80px; }
    .pref-section-header {
      position: sticky; top: 72px; z-index: 40;
      padding: 8px 16px; font-size: 12px; font-weight: 700;
      color: #ff6b6b; background: rgba(10,10,10,0.95);
      border-bottom: 1px solid rgba(255,107,107,0.2);
      letter-spacing: 0.5px;
    }

    /* ===== STORE ITEM ===== */
    .store-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer; transition: background 0.15s;
    }
    .store-item:active { background: rgba(255,255,255,0.05); }
    .rank-badge {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
    }
    .rank-1 { background: #FFD700; color: #000; }
    .rank-2 { background: #C0C0C0; color: #000; }
    .rank-3 { background: #CD7F32; color: #fff; }
    .rank-other { background: rgba(255,255,255,0.1); color: #888; font-size: 11px; }
    .store-thumb {
      flex-shrink: 0; width: 52px; height: 52px; border-radius: 10px;
      object-fit: cover; background: #1a1a1a;
    }
    .store-info { flex: 1; min-width: 0; }
    .store-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .store-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .store-score { flex-shrink: 0; text-align: right; }
    .score-value { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #ff6b6b, #ffd93d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .score-label { font-size: 9px; color: #666; }
    .fav-btn-list {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      border: none; background: rgba(255,255,255,0.08); color: #888;
      font-size: 16px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .fav-btn-list.active { color: #ff6b6b; background: rgba(255,107,107,0.15); }

    /* ===== BOTTOM NAV ===== */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; background: rgba(10,10,10,0.97);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 10px 4px 8px; cursor: pointer;
      border: none; background: none; color: #555; transition: color 0.2s;
      position: relative;
    }
    .nav-tab.active { color: #ff6b6b; }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 10px; margin-top: 3px; font-weight: 600; }
    .nav-dot {
      position: absolute; top: 8px; right: calc(50% - 14px);
      width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b;
      display: none;
    }
    .nav-dot.show { display: block; }

    /* ===== STORE MODAL ===== */
    #store-modal {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
    }
    #store-modal.open { display: flex; }
    #modal-card {
      background: #111; border-radius: 24px 24px 0 0;
      width: 100%; max-width: 480px; max-height: 92dvh;
      overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ===== CAROUSEL ===== */
    #photo-carousel-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #1a1a1a;
      border-radius: 24px 24px 0 0;
      touch-action: pan-y;
    }
    #photo-carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .carousel-slide {
      flex: 0 0 100%;
      height: 100%;
      position: relative;
    }
    .carousel-slide img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .photo-type-label {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 10px; backdrop-filter: blur(4px);
    }
    .carousel-dots {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 5px;
    }
    .photo-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.4); transition: all 0.2s; cursor: pointer;
    }
    .photo-dot.active { background: #fff; transform: scale(1.3); }
    .carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); transition: opacity 0.2s;
    }
    .carousel-arrow:disabled { opacity: 0.2; pointer-events: none; }
    #arrow-prev { left: 10px; }
    #arrow-next { right: 10px; }

    /* ===== MODAL BODY ===== */
    #modal-body { padding: 16px 20px 100px; }
    #modal-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    #modal-category { font-size: 13px; color: #ff6b6b; font-weight: 600; margin-bottom: 8px; }
    #modal-address { font-size: 12px; color: #888; margin-bottom: 14px; }
    .modal-score-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .modal-score-big { font-size: 40px; font-weight: 900; background: linear-gradient(135deg,#ff6b6b,#ffd93d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .modal-score-sub { font-size: 11px; color: #666; }
    .score-bars { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .score-bar-row { display: flex; align-items: center; gap: 8px; }
    .score-bar-label { font-size: 11px; color: #888; width: 56px; }
    .score-bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .score-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg,#ff6b6b,#ffd93d); }
    .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .modal-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; background: rgba(255,255,255,0.08); color: #aaa; }
    #modal-fav-btn {

    .gm-style .gm-style-iw-t::after { display: none; }
    .gm-style .gm-ui-hover-effect { display: none !important; }
    .map-popup {

    .map-popup-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }

    .map-popup-score { font-size: 18px; font-weight: 800; background: linear-gradient(135deg,#ff6b6b,#ffd93d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ===== EMPTY STATE ===== */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: #555; gap: 8px; }
    .empty-state .empty-icon { font-size: 40px; }
    .empty-state p { font-size: 14px; }

    @keyframes heartPop { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
    .heart-pop { animation: heartPop 0.3s ease; }

</head>

  { id:18, name:'那覇国際通り ソーキそば', category:'ラーメン', prefecture:'沖縄県', lat:26.2167, lng:127.6794, score:86, ig:18700, google:4.5, tiktok:54000, address:'那覇市牧志3-2-1', tags:['#沖縄そば','#ソーキ','#沖縄グルメ'] },

// ===== STATE =====
let selectedPrefecture = 'all';
let currentTab = 'map';
let activeInfoWindow = null;
let map = null;
let markers = [];
let favorites = new Set(JSON.parse(localStorage.getItem('buzuri_favs') || '[]'));
let currentStore = null;
let carouselPhotos = [];
let carouselIndex = 0;
let touchStartX = 0;
let touchStartY = 0;

// ===== MAP =====
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 35.6762, lng: 139.6503 },
    zoom: 11,
    styles: [
      { elementType:'geometry', stylers:[{color:'#1a1a1a'}] },
      { elementType:'labels.text.fill', stylers:[{color:'#757575'}] },
      { elementType:'labels.text.stroke', stylers:[{color:'#212121'}] },
      { featureType:'road', elementType:'geometry', stylers:[{color:'#2c2c2c'}] },
      { featureType:'road.arterial', elementType:'labels.text.fill', stylers:[{color:'#757575'}] },
      { featureType:'road.highway', elementType:'geometry', stylers:[{color:'#3c3c3c'}] },
      { featureType:'water', elementType:'geometry', stylers:[{color:'#000000'}] },
      { featureType:'water', elementType:'labels.text.fill', stylers:[{color:'#3d3d3d'}] },
      { featureType:'poi', stylers:[{visibility:'off'}] },
      { featureType:'transit', stylers:[{visibility:'off'}] },
    ],
    disableDefaultUI: true,
    gestureHandling: 'greedy',
  });
  renderMarkers();
  updateFavDot();
}

function renderMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
  if (activeInfoWindow) { activeInfoWindow.close(); activeInfoWindow = null; }

  getFiltered().forEach(store => {
    const size = store.score >= 95 ? 44 : store.score >= 85 ? 38 : 32;
    const bg = store.score >= 95 ? '#ff6b6b' : store.score >= 85 ? '#ffd93d' : '#4ecdc4';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="20" fill="${bg}" stroke="#fff" stroke-width="3"/>
      <text x="22" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#000" font-family="Arial">${store.score}</text>
    </svg>`;
    const marker = new google.maps.Marker({
      position: { lat: store.lat, lng: store.lng },
      map,
      icon: { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new google.maps.Size(size, size), anchor: new google.maps.Point(size/2, size/2) },
      zIndex: store.score,
    });
    const iw = new google.maps.InfoWindow({
      content: `<div class="map-popup" onclick="openStore(${store.id})">
        <div class="map-popup-name">${store.name}</div>
        <div class="map-popup-meta">${store.category} · ${store.prefecture}</div>
        <div class="map-popup-score">${store.score}</div>
      </div>`,
      pixelOffset: new google.maps.Size(0, -size/2 - 4),
    });
    marker.addListener('click', () => {
      if (activeInfoWindow) activeInfoWindow.close();
      iw.open(map, marker);
      activeInfoWindow = iw;
    });
    markers.push(marker);
  });
}

function getFiltered() {
  return selectedPrefecture === 'all' ? STORES : STORES.filter(s => s.prefecture === selectedPrefecture);
}

function selectPref(pref) {
  selectedPrefecture = pref;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.pref === pref));
  if (currentTab === 'map') {
    renderMarkers();
    if (pref !== 'all') {
      const stores = getFiltered();
      if (stores.length) {
        const bounds = new google.maps.LatLngBounds();
        stores.forEach(s => bounds.extend({ lat: s.lat, lng: s.lng }));
        map.fitBounds(bounds, { top: 80, bottom: 80, left: 40, right: 40 });
      }
    } else {
      map.setCenter({ lat: 36.2048, lng: 138.2529 }); map.setZoom(6);
    }
  } else if (currentTab === 'ranking') {
    renderRanking();
  }
}

// ===== TABS =====
function switchTab(tab) {
  currentTab = tab;
  ['map','ranking','favorites'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  document.getElementById('map-view').style.display = tab === 'map' ? 'flex' : 'none';
  document.getElementById('ranking-view').style.display = tab === 'ranking' ? 'flex' : 'none';
  document.getElementById('favorites-view').style.display = tab === 'favorites' ? 'flex' : 'none';
  document.getElementById('filter-bar').style.display = tab === 'favorites' ? 'none' : 'flex';
  if (tab === 'ranking') renderRanking();
  if (tab === 'favorites') renderFavorites();
}

// ===== RANKING =====
function renderRanking() {
  const container = document.getElementById('ranking-body');
  container.innerHTML = '';
  const title = document.getElementById('ranking-title');
  const countEl = document.getElementById('ranking-count');

  if (selectedPrefecture !== 'all') {
    const list = getFiltered().sort((a,b) => b.score - a.score);
    title.textContent = `🏆 ${selectedPrefecture}ランキング`;
    countEl.textContent = ` ${list.length}件`;
    list.forEach((s,i) => container.appendChild(makeStoreItem(s, i+1, false)));
    return;
  }

  title.textContent = '🏆 全国ランキング';
  let total = 0;
  PREF_ORDER.forEach(pref => {
    const ps = STORES.filter(s => s.prefecture === pref).sort((a,b) => b.score - a.score);
    if (!ps.length) return;
    total += ps.length;
    const h = document.createElement('div');
    h.className = 'pref-section-header';
    h.textContent = pref;
    container.appendChild(h);
    ps.forEach((s,i) => container.appendChild(makeStoreItem(s, i+1, true)));
  });
  countEl.textContent = ` ${total}件`;
}

function makeStoreItem(store, rank, showPref) {
  const div = document.createElement('div');
  div.className = 'store-item';
  const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
  const thumbPhotos = CATEGORY_PHOTO_SETS[store.category] || DEFAULT_PHOTOS;
  const isFav = favorites.has(store.id);
  div.innerHTML = `
    <div class="rank-badge ${rankClass}">${rank}</div>
    <img class="store-thumb" src="${thumbPhotos[0].url}" alt="${store.name}" loading="lazy">
    <div class="store-info">
      <div class="store-name">${store.name}</div>
      <div class="store-meta">${store.category} · ${store.address}</div>
    </div>
    <div class="store-score">
      <div class="score-value">${store.score}</div>
      <div class="score-label">スコア</div>
    </div>
    <button class="fav-btn-list ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${store.id})">${isFav ? '❤️' : '🤍'}</button>
  `;
  div.querySelector('.store-info').addEventListener('click', () => openStore(store.id));
  div.querySelector('.rank-badge').addEventListener('click', () => openStore(store.id));
  div.querySelector('.store-thumb').addEventListener('click', () => openStore(store.id));
  return div;
}

// ===== FAVORITES =====
function renderFavorites() {
  const container = document.getElementById('favorites-body');
  container.innerHTML = '';
  const favStores = STORES.filter(s => favorites.has(s.id)).sort((a,b) => b.score - a.score);
  if (!favStores.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🤍</div><p>まだお気に入りがありません</p></div>`;
    return;
  }
  favStores.forEach((s,i) => container.appendChild(makeStoreItem(s, i+1, true)));
}

function toggleFav(e, id) {
  e.stopPropagation();
  const btn = e.currentTarget;
  if (favorites.has(id)) {
    favorites.delete(id);
    btn.textContent = '🤍'; btn.classList.remove('active');
  } else {
    favorites.add(id);
    btn.textContent = '❤️'; btn.classList.add('active');
    btn.classList.add('heart-pop');
    setTimeout(() => btn.classList.remove('heart-pop'), 300);
  }
  saveFavs();
}

function saveFavs() {
  localStorage.setItem('buzuri_favs', JSON.stringify([...favorites]));
  updateFavDot();
}

function updateFavDot() {
  document.getElementById('fav-dot').classList.toggle('show', favorites.size > 0);
}

// ===== MODAL =====
function openStore(id) {
  const store = STORES.find(s => s.id === id);
  if (!store) return;
  currentStore = store;
  document.getElementById('modal-name').textContent = store.name;
  document.getElementById('modal-category').textContent = `📍 ${store.category} · ${store.prefecture}`;
  document.getElementById('modal-address').textContent = store.address;
  document.getElementById('modal-score-big').textContent = store.score;
  const barsEl = document.getElementById('modal-score-bars');
  barsEl.innerHTML = [
    { label: 'Instagram', val: Math.round(store.ig / 600), raw: store.ig.toLocaleString() },
    { label: 'Google', val: Math.round(store.google * 20), raw: store.google },
    { label: 'TikTok', val: Math.round(store.tiktok / 2500), raw: (store.tiktok/1000).toFixed(0)+'K' },
  ].map(b => `
    <div class="score-bar-row">
      <span class="score-bar-label">${b.label}</span>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min(b.val,100)}%"></div></div>
      <span style="font-size:10px;color:#888;width:36px;text-align:right">${b.raw}</span>
    </div>
  `).join('');
  document.getElementById('modal-tags').innerHTML = (store.tags||[]).map(t=>`<span class="modal-tag">${t}</span>`).join('');
  updateModalFavBtn();
  buildCarousel(store.category);
  document.getElementById('store-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateModalFavBtn() {
  const btn = document.getElementById('modal-fav-btn');
  const isFav = favorites.has(currentStore?.id);
  btn.textContent = isFav ? '❤️ お気に入りに登録済み' : '❤️ お気に入りに追加';
  btn.classList.toggle('saved', isFav);
}

function toggleFavFromModal() {
  if (!currentStore) return;
  if (favorites.has(currentStore.id)) { favorites.delete(currentStore.id); } else { favorites.add(currentStore.id); }
  saveFavs();
  updateModalFavBtn();
}

function closeModal(e) {
  if (e.target === document.getElementById('store-modal')) {
    document.getElementById('store-modal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

// ===== CAROUSEL =====
function buildCarousel(category) {
  carouselPhotos = CATEGORY_PHOTO_SETS[category] || DEFAULT_PHOTOS;
  carouselIndex = 0;
  const track = document.getElementById('photo-carousel-track');
  track.innerHTML = '';
  track.style.transform = 'translateX(0)';
  carouselPhotos.forEach(p => {
    const slide = document.createElement('div');
    slide.className = 'carousel-slide';
    slide.innerHTML = `<img src="${p.url}" alt="${p.label}" loading="lazy"><div class="photo-type-label">${p.label}</div>`;
    track.appendChild(slide);
  });
  const dotsEl = document.getElementById('carousel-dots');
  dotsEl.innerHTML = '';
  carouselPhotos.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'photo-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToSlide(i);
    dotsEl.appendChild(dot);
  });
  updateArrows();
  setupCarouselTouch();
}

function goToSlide(idx) {
  carouselIndex = Math.max(0, Math.min(idx, carouselPhotos.length - 1));
  document.getElementById('photo-carousel-track').style.transform = `translateX(-${carouselIndex * 100}%)`;
  document.querySelectorAll('.photo-dot').forEach((d, i) => d.classList.toggle('active', i === carouselIndex));
  updateArrows();
}

function updateArrows() {
  document.getElementById('arrow-prev').disabled = carouselIndex === 0;
  document.getElementById('arrow-next').disabled = carouselIndex === carouselPhotos.length - 1;
}

function setupCarouselTouch() {
  const wrap = document.getElementById('photo-carousel-wrap');
  wrap.ontouchstart = e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; };
  wrap.ontouchmove = e => { e.stopPropagation(); };
  wrap.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) goToSlide(dx < 0 ? carouselIndex + 1 : carouselIndex - 1);
  };
}

window.onload = () => {
  document.getElementById('map-view').style.display = 'flex';
  initMap();
};
</script>
